<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 활동 · 폭스러닝센터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EF;--card:#fff;--ink:#1E2330;--sub:#5F6675;--line:#ECE8E1;--p:#F2622E;--pl:#FFF1EA;
  --live:#E5484D;--r:1.75rem;
  --shadow:0 1px 2px rgba(30,35,48,.04),0 .6rem 1.8rem rgba(30,35,48,.07);
  --font:'Pretendard Variable',Pretendard,'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:84rem;margin:0 auto;padding:1.75rem 1.5rem 4rem}

/* ── 머리 ── */
.top{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;margin-bottom:1.75rem}
.fox{height:5.5rem;width:auto;flex:none}
.top-text{flex:1 1 16rem;min-width:0}
.eyebrow{display:inline-block;font-size:1rem;font-weight:700;color:var(--p);background:var(--pl);border-radius:99px;padding:.15rem .8rem;margin-bottom:.35rem}
.date{font-size:2.9rem;font-weight:800;line-height:1.15;letter-spacing:-.035em}
.date small{font-size:1.15rem;color:var(--sub);margin-left:.7rem;font-weight:600;letter-spacing:-.01em}
.tools{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.clock{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card);box-shadow:var(--shadow);border-radius:99px;padding:.45rem 1.2rem}
.fs{display:flex;align-items:center;background:var(--card);box-shadow:var(--shadow);border-radius:99px;overflow:hidden}
.fs button{border:0;background:none;min-width:3.2rem;min-height:3.2rem;font-weight:700;font-size:1rem;padding:0 .8rem;color:var(--sub)}
.fs button:hover{background:var(--pl);color:var(--p)}
.fs button:disabled{opacity:.3;cursor:default;background:none;color:var(--sub)}
.fs button + button{border-left:1px solid var(--line)}
.fs .big{font-size:1.4rem}

/* ── 이름 찾기 ── */
.names{background:var(--card);box-shadow:var(--shadow);border-radius:var(--r);padding:1.4rem 1.6rem;margin-bottom:1.5rem}
.names h2{font-size:1.2rem;font-weight:700;margin-bottom:.9rem;color:var(--sub)}
.name-list{display:flex;flex-wrap:wrap;gap:.55rem}
.nm{border:0;background:var(--bg);border-radius:99px;padding:.5rem 1.15rem;font-size:1.25rem;font-weight:600;min-height:3rem;transition:background .15s,color .15s,transform .15s}
.nm:hover{background:var(--pl);color:var(--p)}
.nm:active{transform:scale(.96)}
.nm[aria-pressed="true"]{background:var(--p);color:#fff}

.mine{background:var(--ink);color:#fff;border-radius:var(--r);padding:1.6rem 1.8rem;margin-bottom:1.5rem;box-shadow:var(--shadow)}
.mine-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.mine h2{font-size:1.8rem;font-weight:800;letter-spacing:-.03em}
.mine .close{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:.4rem 1.2rem;font-size:1.05rem;font-weight:600;min-height:2.8rem}
.mine .close:hover{background:rgba(255,255,255,.24)}
.mine ol{list-style:none;display:grid;gap:.6rem}
.mine li{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:rgba(255,255,255,.08);border-radius:1.1rem;padding:.9rem 1.2rem}
.mine .when{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:11.5rem;letter-spacing:-.02em}
.mine .lab-tag{background:var(--c);color:#fff;border-radius:99px;padding:.2rem .9rem;font-weight:700;font-size:1.1rem}
.mine .what{font-size:1.2rem;font-weight:500;flex:1 1 12rem;opacity:.92}

/* ── 카드: 한 줄에 2개 ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:1.8rem 1.9rem 1.9rem;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:.4rem;background:var(--c)}
.card.hit{box-shadow:0 0 0 .22rem var(--c),var(--shadow)}
.head{display:flex;align-items:center;gap:.9rem;margin-bottom:1.1rem}
.ico{flex:none;width:3.6rem;height:3.6rem;border-radius:1.15rem;background:var(--cl);display:grid;place-items:center;font-size:1.9rem;line-height:1}
.head h3{font-size:1.5rem;font-weight:800;color:var(--cd);letter-spacing:-.03em;line-height:1.2}
.item + .item{border-top:1px solid var(--line);margin-top:1.4rem;padding-top:1.4rem}
.title{font-size:1.85rem;font-weight:800;line-height:1.3;letter-spacing:-.035em}
.theme{font-size:1.05rem;color:var(--sub);font-weight:500;margin-top:.4rem}
.slots{list-style:none;margin-top:1.1rem;display:grid;gap:.55rem}
.slot{display:flex;align-items:center;gap:.5rem 1.1rem;flex-wrap:wrap;background:var(--cl);border-radius:1.15rem;padding:.8rem 1.1rem;position:relative}
.slot.done{opacity:.45}
.slot.live{background:var(--card);box-shadow:inset 0 0 0 .16rem var(--live)}
.slot.mine-slot{box-shadow:inset 0 0 0 .16rem var(--c)}
.time{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cd);letter-spacing:-.02em;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;min-width:11.2rem}
.badge{font-size:.85rem;font-weight:700;border-radius:99px;padding:.12rem .65rem;background:var(--live);color:#fff;letter-spacing:0}
.badge.end{background:var(--sub)}
.note{font-size:1rem;font-weight:500;color:var(--sub);letter-spacing:-.01em}
.who{display:flex;flex-wrap:wrap;gap:.4rem;flex:1 1 10rem}
.who span{background:var(--card);border-radius:99px;padding:.2rem .85rem;font-size:1.25rem;font-weight:600;box-shadow:0 1px 2px rgba(30,35,48,.08)}
.slot.live .who span:not(.me){background:var(--cl);box-shadow:none}
.who span.me{background:var(--c);color:#fff}
.desc{margin-top:1.1rem;font-size:1.15rem;line-height:1.65;color:var(--sub);white-space:pre-line}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:.5rem;border:0;background:none;color:var(--cd);font-weight:700;font-size:1.05rem;padding:.4rem 0;min-height:2.6rem}

/* ── 활동 1·2 / Part 1·2 ── */
.acts{margin-top:1.3rem;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:.9rem 1.4rem}
.act{display:contents}
.act > *{grid-column:var(--col);grid-row:var(--row)}
.act-head{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding-bottom:.2rem}
.act-no{background:var(--c);color:#fff;font-weight:800;font-size:1.05rem;border-radius:99px;padding:.25rem .85rem;flex:none}
.act-head h4{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.part{background:var(--cl);border-radius:1.25rem;padding:1.15rem 1.3rem 1.25rem}
.part-head{display:flex;align-items:baseline;gap:.4rem .7rem;flex-wrap:wrap;margin-bottom:.6rem}
.part-no{flex:none;font-size:.95rem;font-weight:800;color:var(--cd);background:#fff;border-radius:.6rem;padding:.15rem .6rem;align-self:center}
.part-head b{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.cond{font-size:.95rem;font-weight:600;color:var(--sub);background:#fff;border-radius:99px;padding:.1rem .65rem;align-self:center}
.q{font-size:1.15rem;font-weight:600;color:var(--cd);margin-bottom:.6rem;line-height:1.5}
.q::before{content:"💭 "}
.steps{list-style:none;display:grid;gap:.45rem}
.steps li{position:relative;padding-left:1.2rem;font-size:1.15rem;line-height:1.6;color:var(--ink)}
.steps li::before{content:"";position:absolute;left:.15rem;top:.68em;width:.42rem;height:.42rem;border-radius:50%;background:var(--c);opacity:.7}
.ref{margin-top:.8rem;font-size:1rem;color:var(--sub)}
.ref span{font-weight:700;color:var(--cd);margin-right:.2rem}
.desc.after{margin-top:1.1rem}

/* ── 튼튼: 끌어서 시간 고르기 ── */
.card.wide{grid-column:1/-1}
.board{margin-top:1.2rem;display:grid;gap:1rem}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.zone{border-radius:1.25rem;padding:1rem 1.1rem 1.15rem;border:2px dashed var(--line);background:var(--bg);transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.zone.time-zone{background:var(--cl);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.zone.time-zone.done{opacity:.55}
.zone.time-zone.live{box-shadow:inset 0 0 0 .16rem var(--live);border-color:transparent}
body.dragging .board .zone{border-color:var(--c)}
.zone.over{border-style:solid;border-color:var(--c);background:#fff;transform:scale(1.015);box-shadow:0 .5rem 1.4rem rgba(30,35,48,.12)}
.zone-head{display:flex;align-items:center;gap:.4rem .8rem;flex-wrap:wrap;margin-bottom:.8rem;min-height:2.4rem}
.zone-title{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.zone .time{min-width:0}
.hint{font-size:1rem;color:var(--sub)}
.count{margin-left:auto;font-size:1rem;font-weight:700;color:var(--cd);background:#fff;border-radius:99px;padding:.15rem .75rem}
.put{border:0;background:var(--c);color:#fff;font-weight:700;font-size:1rem;border-radius:99px;padding:.35rem 1rem;min-height:2.4rem}
.pool .put{margin-left:auto}
.drop{display:flex;flex-wrap:wrap;gap:.55rem;min-height:3.4rem;align-content:flex-start}
.chip{border:0;background:#fff;border-radius:99px;padding:.5rem 1.15rem .5rem .85rem;font-size:1.35rem;font-weight:700;min-height:3.3rem;display:inline-flex;align-items:center;gap:.45rem;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 1px 2px rgba(30,35,48,.1),0 .25rem .7rem rgba(30,35,48,.07);transition:box-shadow .15s,transform .15s}
.chip::before{content:"";width:.55rem;height:1rem;flex:none;opacity:.35;background:radial-gradient(circle,currentColor 1.2px,transparent 1.5px) 0 0/.275rem .333rem}
.chip:hover{box-shadow:0 0 0 .14rem var(--c),0 .25rem .7rem rgba(30,35,48,.1)}
.chip:active{transform:scale(.97)}
.chip.me{box-shadow:0 0 0 .18rem var(--c),0 .25rem .7rem rgba(30,35,48,.08)}
.chip.sel{background:var(--c);color:#fff}
.chip.lifting{opacity:.25}
.chip.ghost{position:fixed;left:0;top:0;z-index:50;margin:0;pointer-events:none;cursor:grabbing;box-shadow:0 1rem 2.4rem rgba(30,35,48,.28);transition:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.empty{align-self:center;color:var(--sub);font-size:1.05rem;padding:.2rem .3rem}

/* ── 상태 ── */
.state{text-align:center;padding:4rem 1.5rem;background:var(--card);box-shadow:var(--shadow);border-radius:var(--r)}
.state img{height:11rem;width:auto}
.state h2{font-weight:800;font-size:2rem;letter-spacing:-.03em;margin:1rem 0 .4rem}
.state p{color:var(--sub);font-size:1.15rem}
.setup{max-width:40rem;margin:1.4rem auto 0;display:flex;gap:.6rem;flex-wrap:wrap}
.setup input{flex:1 1 16rem;font:inherit;padding:.8rem 1.1rem;border:1px solid var(--line);border-radius:1rem;background:var(--bg)}
.setup button{border:0;background:var(--p);color:#fff;font-weight:700;border-radius:1rem;padding:.8rem 1.4rem;font-size:1.05rem}
.teacher{max-width:40rem;margin:1.8rem auto 0;text-align:left;font-size:.95rem;color:var(--sub)}
.teacher summary{cursor:pointer;font-weight:700;padding:.5rem 0}
.teacher p{font-size:.95rem;margin:.4rem 0;overflow-wrap:anywhere}
.teacher button{margin-top:.5rem;border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:.5rem 1rem;font-weight:700;min-height:2.6rem}
.foot{margin-top:2rem;text-align:center;color:var(--sub);font-size:.95rem}
.foot .warn{color:var(--live);font-weight:700}

@media (max-width:52rem){
  .grid{grid-template-columns:1fr}
  .wrap{padding:1.1rem 1rem 3rem}
  .date{font-size:2.1rem}.fox{height:4rem}
  .card{padding:1.5rem 1.3rem 1.4rem}
  .time,.mine .when{min-width:0}
  .zones{grid-template-columns:1fr}
  .acts{display:block}
  .act{display:block}
  .act > *{margin-top:.8rem}
  .act + .act{margin-top:1.8rem}
}
@media (prefers-reduced-motion:no-preference){.slot.live .badge:not(.end){animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img class="fox" src="images/fox-mascot.png" alt="">
    <div class="top-text">
      <div class="eyebrow">오늘의 활동</div>
      <h1 class="date" id="date">&nbsp;</h1>
    </div>
    <div class="tools">
      <div class="clock" id="clock" aria-label="지금 시각"></div>
      <div class="fs" role="group" aria-label="글자 크기">
        <button type="button" id="fsDown" aria-label="글자 작게">가−</button>
        <button type="button" id="fsUp" class="big" aria-label="글자 크게">가+</button>
      </div>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ═══════════ 설정 ═══════════
   schedule.gs 를 웹 앱으로 배포한 주소(…/exec)를 여기에 넣으세요.
   비워 두면 화면에서 한 번 붙여넣을 수 있고, 그 기기에 저장됩니다. */
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyXMkk0wqkinmSP5CSGffLq2bw7LXstFneb02WXfS35QTZdp7f53Ukj_SoRfkuombEk/exec';
const REFRESH_MS = 60 * 1000;        // 시트 다시 읽는 간격
const NAME_RESET_MS = 90 * 1000;     // 이름 선택 자동 해제 (다음 친구를 위해)

/* 튼튼: 이름을 끌어서 시간을 고르는 칸
   - 명단을 바꾸려면 아래 이름만 고치면 돼요.
   - 시트에 그날 "16:00 ~ 16:30", "16:30 ~ 17:00" 칸이 있거나 튼튼 시간이 적혀 있지 않으면 나타나요. */
const TUNTEUN_ROSTER = ['김도영', '김윤성', '김재이', '김지윤', '김태웅', '박지상', '성시윤', '송지호', '신유준', '진우주'];
const TUNTEUN_ZONES = [
  { label: '16:00~16:30', start: 16 * 60,      end: 16 * 60 + 30 },
  { label: '16:30~17:00', start: 16 * 60 + 30, end: 17 * 60 },
];

/* ═══════════ 작은 도구들 ═══════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const params = new URLSearchParams(location.search);
if (params.get('api')) store.set('schedule_api', params.get('api'));
const dateOverride = /^\d{4}-\d{2}-\d{2}$/.test(params.get('date') || '') ? params.get('date') : '';

/* ═══════════ 글자 크기 ═══════════ */
const FS_MIN = 70, FS_MAX = 220, FS_STEP = 10;
let fs = Number(store.get('schedule_fs')) || 100;
function applyFs(){
  fs = Math.min(FS_MAX, Math.max(FS_MIN, fs));
  document.documentElement.style.fontSize = fs + '%';
  $('fsDown').disabled = fs <= FS_MIN;
  $('fsUp').disabled = fs >= FS_MAX;
  store.set('schedule_fs', String(fs));
}
$('fsDown').onclick = () => { fs -= FS_STEP; applyFs(); };
$('fsUp').onclick = () => { fs += FS_STEP; applyFs(); };
applyFs();

/* ═══════════ 연구소 색·그림 ═══════════ */
const LAB_STYLES = [
  [/AI\s*프로젝트/i,  '🧩', '#6D4FB8', '#EFEAFB', '#523A93'],
  [/AI|인공지능/i,     '🤖', '#2563C9', '#E6EEFC', '#1B4C9E'],
  [/합창|음악/,        '🎵', '#A8389B', '#F8E8F6', '#842A7A'],
  [/성장/,             '🌱', '#4D8A2A', '#EAF5E2', '#3A6B1E'],
  [/SEL/i,             '💗', '#CF3F68', '#FCE8EE', '#A62E51'],
  [/튼튼/,             '💪', '#23855B', '#E2F5EC', '#1A6645'],
  [/영어\s*프로젝트/,  '🌍', '#0B7285', '#E0F4F7', '#085866'],
  [/영어/,             '🔤', '#0B7FA6', '#E1F2F9', '#086384'],
  [/플레이/,           '🎲', '#B85C00', '#FFF0DC', '#8F4700'],
  [/미술/,             '🎨', '#C2410C', '#FDEBE3', '#9A3309'],
  [/수리|수학/,        '🔢', '#3F6FA0', '#E7EFF7', '#2F577F'],
  [/딥러닝/,           '📚', '#4F5596', '#EBECF7', '#3D4278'],
];
const FALLBACK = [['⭐','#8A5A2B','#F6ECE1','#6B4520'],['⭐','#2F7C83','#E3F3F4','#236166'],['⭐','#7A4FA0','#F0E8F7','#5F3C7E']];
function labStyle(name){
  for (const [re, ...s] of LAB_STYLES) if (re.test(name)) return s;
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return FALLBACK[h % FALLBACK.length];
}

/* ═══════════ 시트 글자 해석 ═══════════ */
const T = '(\\d{1,2})(?:\\s*[:：시]\\s*(\\d{1,2})?\\s*분?)?';
const RANGE_RE = new RegExp('^' + T + '\\s*(?:~|〜|-|–|—)\\s*' + T);
const SINGLE_RE = /^(\d{1,2})\s*(?::\s*(\d{2})|시(?:\s*(\d{1,2})\s*분)?)/;
const NAME_RE = /^[가-힣]{2,4}$/;

function toMin(h, m){
  h = Number(h); m = Number(m || 0);
  if (!(h >= 0 && h <= 23 && m >= 0 && m <= 59)) return null;
  return h * 60 + m;
}
// 센터는 낮~저녁에 열려요: 1~8시는 오후로 봅니다 (정렬·지금 표시용)
const pm = min => (min != null && min < 9 * 60) ? min + 12 * 60 : min;
const fmt = min => Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0');

function splitNames(text){
  const notes = [];
  const bare = text.replace(/\([^)]*\)/g, m => { notes.push(m); return ' '; }).replace(/^[\s\-–•*:：]+/, '').trim();
  if (!bare) return null;
  const tokens = bare.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
  if (!tokens.length || !tokens.every(t => NAME_RE.test(t))) return null;
  return { names: tokens, note: notes.join(' ') };
}

const INLINE_RANGE_RE = /\d{1,2}\s*:\s*\d{2}\s*(?:~|〜|-|–|—)\s*\d{1,2}\s*:\s*\d{2}/;

// 한 줄에 "이름 시간 / 이름 시간" 처럼 여러 개가 있으면 나눠서 읽어요
function parseTimeLine(line){
  const parts = line.split(/\s+\/\s+/);
  if (parts.length > 1) {
    const all = parts.map(parseTimePart);
    if (all.every(Boolean)) return all.flat();
  }
  return parseTimePart(line);
}

function parseTimePart(line){
  // "김재이 15:30~16:00", "Class 1: 13:00 ~ 14:00" 처럼 시간 앞에 짧은 말이 붙은 경우
  const at = line.search(INLINE_RANGE_RE);
  if (at > 0 && at <= 16) {
    const head = line.slice(0, at).trim();
    const n = splitNames(head);
    const label = /[:：]$/.test(head) ? head.replace(/\s*[:：]$/, '') : '';
    if (head && (n || label)) {
      const slots = parseTimePart(line.slice(at));
      if (slots && slots.every(s => !s.names.length)) {
        slots.forEach(s => { if (n) s.names = n.names.slice(); else s.note = [label, s.note].filter(Boolean).join(' '); });
        slots.fixed = !!n || undefined;
        return slots;
      }
    }
  }
  let rest = line.replace(/^[\s\-–•*]*(?:시간\s*[:：])?\s*/, '');
  const slots = [];
  for (;;) {
    const m = RANGE_RE.exec(rest);
    if (!m) break;
    const bareBoth = !/[:：시]/.test(m[0]);
    const a = toMin(m[1], m[2]), b = toMin(m[3], m[4]);
    if (a == null || b == null) break;
    if (bareBoth && !(Number(m[1]) >= 9 && Number(m[3]) <= 21)) break;   // "2-3명" 같은 글자 방지
    slots.push({ start: a, end: b, names: [], note: '' });
    rest = rest.slice(m[0].length);
    const sep = /^\s*[\/,]\s*/.exec(rest);
    if (!sep) break;
    rest = rest.slice(sep[0].length);
  }
  if (!slots.length) {
    const m = SINGLE_RE.exec(rest);
    if (!m) return null;
    const a = toMin(m[1], m[2] || m[3]);
    if (a == null) return null;
    slots.push({ start: a, end: null, names: [], note: '' });
    rest = rest.slice(m[0].length);
  }
  rest = rest.trim();
  if (rest) {
    const n = splitNames(rest);
    for (const s of slots) {
      if (n) { s.names = n.names.slice(); s.note = n.note; }
      else s.note = rest.replace(/^[\-–:：\s]+/, '');
    }
  }
  return slots;
}

// "간식 먹는 친구, 김재이, 김태웅" 처럼 메모와 이름이 섞인 줄
function splitMixed(line){
  if (!/[,，、]/.test(line)) return null;
  const tokens = line.replace(/\([^)]*\)/g, ' ').split(/[,，、]/).map(t => t.trim()).filter(Boolean);
  const names = tokens.filter(t => NAME_RE.test(t)), other = tokens.filter(t => !NAME_RE.test(t));
  if (!names.length || !other.length || other.some(t => t.length > 15)) return null;
  return { names, note: other.join(', ') };
}

const norm = s => s.replace(/[\[\]"'“”‘’「」\s]/g, '').toLowerCase();

function parseBody(text, title){
  const slots = [], desc = [];
  let open = null;          // 방금 만든 시간칸 (다음 줄의 이름을 받을 수 있음)
  let waiting = null;       // 시간보다 먼저 나온 이름 줄
  for (const raw of String(text).replace(/\r/g, '').split('\n')) {
    const line = raw.trim();
    if (!line) { if (desc.length && desc[desc.length - 1] !== '') desc.push(''); continue; }
    const ts = parseTimeLine(line);
    if (ts) {
      if (waiting && ts.every(s => !s.names.length)) { ts.forEach(s => s.names = waiting.names.slice()); open = null; }
      else open = ts.every(s => !s.names.length) ? ts : null;
      waiting = null;
      slots.push(...ts);
      continue;
    }
    const n = splitNames(line);
    if (n && open) {
      open.forEach(s => { s.names = n.names.slice(); if (n.note) s.note = [s.note, n.note].filter(Boolean).join(' '); });
      open = null; continue;
    }
    if (open) {
      const mixed = splitMixed(line);
      if (mixed) {
        open.forEach(s => { s.names = mixed.names.slice(); s.note = [s.note, mixed.note].filter(Boolean).join(' '); });
        open = null; continue;
      }
      // 시간 바로 아래의 짧은 메모 (예: "간식 안먹는 친구")
      if (line.length <= 15 && open.every(s => !s.note)) { open.forEach(s => s.note = line); continue; }
    }
    open = null;
    if (n && n.names.length >= 2 && !n.note) { waiting = n; continue; }
    if (/^[\[\]\-\s]*$/.test(line)) continue;
    if (title && norm(line) === norm(title)) continue;
    desc.push(line);
  }
  if (waiting) desc.push(waiting.names.join(', '));
  while (desc.length && desc[desc.length - 1] === '') desc.pop();
  while (desc.length && desc[0] === '') desc.shift();
  slots.forEach((s, i) => s.i = i);
  slots.sort((x, y) => (pm(x.start) - pm(y.start)) || (x.i - y.i));
  return { slots, desc: desc.join('\n') };
}

/* "활동 1 : 제목 / Part 1｜제목 / 질문? / 설명 / 레슨플랜 참고 : 「…」" 구조 읽기 */
const SEP = '\\s*[:：｜|]\\s*';
const ACT_RE = new RegExp('^활동\\s*(\\d+)(?:' + SEP + '(.*))?$');
const PART_RE = new RegExp('^(Part\\s*\\d+|파트\\s*\\d+|새로\\s*시작|이어\\s*하기)' + SEP + '(.*)$', 'i');
const REF_RE = new RegExp('^레슨\\s*플랜\\s*참고(?:' + SEP + '|\\s+)(.*)$');
const COND_RE = /^(.{1,20}?(?:을|를)\s*마쳤다면)\s*/;
const sentences = t => t.split(/(?<=[.!?])\s+/).map(x => x.trim()).filter(Boolean);

function parseActivities(desc){
  const lines = String(desc || '').split('\n').map(l => l.trim());
  const acts = [], before = [], after = [];
  let act = null, part = null, blank = false;
  const body = (target, text) => {
    if (!target.question && !target.steps.length && /\?$/.test(text)) { target.question = text; return; }
    target.steps.push(...sentences(text));
  };
  for (const line of lines) {
    if (!line) { blank = true; continue; }
    let m;
    if ((m = ACT_RE.exec(line))) {
      act = { no: m[1], title: (m[2] || '').trim(), parts: [], intro: { question: '', steps: [] } };
      acts.push(act); part = null; blank = false; continue;
    }
    if (act && blank && !PART_RE.test(line) && !REF_RE.test(line)) { act = null; part = null; }
    blank = false;
    if (!act) { (acts.length ? after : before).push(line); continue; }
    if ((m = PART_RE.exec(line))) {
      let label = m[1].replace(/\s+/g, ' ').replace(/^part/i, 'Part'), rest = m[2].trim(), cond = '';
      const c = COND_RE.exec(rest);
      if (c) { cond = c[1]; rest = rest.slice(c[0].length); }
      part = { label, title: '', cond, question: '', steps: [], ref: '' };
      // "Part 1｜짧은 제목" 이면 제목, "새로 시작 : 긴 설명" 이면 설명
      if (rest && rest.length <= 30 && !/[.!?]$/.test(rest)) part.title = rest; else if (rest) body(part, rest);
      act.parts.push(part); continue;
    }
    if ((m = REF_RE.exec(line))) {
      const ref = m[1].trim();
      if (part) part.ref = [part.ref, ref].filter(Boolean).join(' ');
      else act.intro.steps.push('레슨플랜 참고 ' + ref);
      continue;
    }
    body(part || act.intro, line);
  }
  const partsCount = acts.reduce((n, a) => n + a.parts.length, 0);
  if (!acts.length || (acts.length < 2 && partsCount < 2)) return null;
  return { acts, before: before.join('\n'), after: after.join('\n') };
}

function parseLabel(a){
  const lines = a.replace(/\r/g, '').split('\n').map(s => s.trim()).filter(Boolean);
  let name = lines.shift() || '활동';
  const extra = [];
  for (const l of lines) {
    if (!extra.length && l.length <= 6 && !/[:：]/.test(l)) name += ' ' + l;
    else extra.push(l);
  }
  const theme = extra.find(l => /주간\s*주제/.test(l)) || '';
  return { name, theme: theme.replace(/\s*[:：]\s*/, ': ') };
}

function parseTitle(t){
  const lines = String(t).replace(/\r/g, '').split('\n').map(s => s.trim());
  // 제목 칸에 시간까지 같이 적은 경우: 첫 문단만 제목으로
  const hasTime = lines.some(l => parseTimeLine(l));
  let head = lines, tail = [];
  if (hasTime) {
    const cut = lines.findIndex((l, i) => i > 0 && (!l || parseTimeLine(l)));
    if (cut > 0) { head = lines.slice(0, cut); tail = lines.slice(cut); }
  }
  let title = head.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
  const m = /^\[(.*)\]$/.exec(title); if (m) title = m[1].trim();
  title = title.replace(/^"(.*)"$/, '$1').trim();
  return { title, tail: tail.join('\n') };
}

function buildLabs(rows){
  const groups = []; let cur = null, pending = null;
  for (const [a, b] of rows) {
    if (a.trim()) { cur = { label: a, items: [] }; groups.push(cur); pending = { t: b, b: '' }; cur.items.push(pending); continue; }
    if (!cur) { cur = { label: '', items: [] }; groups.push(cur); }
    if (pending) { pending.b = b; pending = null; }
    else { pending = { t: b, b: '' }; cur.items.push(pending); }
  }
  const labs = [];
  for (const g of groups) {
    const { name, theme } = parseLabel(g.label);
    const items = [];
    for (const it of g.items) {
      if (!it.t.trim() && !it.b.trim()) continue;
      const { title, tail } = parseTitle(it.t);
      const { slots, desc } = parseBody([tail, it.b].filter(s => s.trim()).join('\n'), title);
      if (!title && !slots.length && !desc) continue;
      items.push({ title, slots, desc, acts: parseActivities(desc) });
    }
    if (items.length) labs.push({ name, theme, items, style: labStyle(name) });
  }
  return labs;
}

/* ═══════════ 화면 그리기 ═══════════ */
const state = { data: null, labs: [], me: '', sel: '', open: new Set(), stale: false, error: '' };
// 튼튼 시간 고르기: server = 시트에 저장된 내용, pending = 아직 시트에 안 보낸 내용
const tState = { date: '', sync: false, server: null, pending: {}, failed: false };
const ko = (a, b) => a.localeCompare(b, 'ko');

function attachBoards(labs){
  for (const l of labs) {
    if (!/튼튼/.test(l.name) || !l.items.length) continue;
    const it = l.items[0];
    const zoneOf = s => s.end != null && TUNTEUN_ZONES.find(z => pm(s.start) === z.start && pm(s.end) === z.end);
    // 토요일처럼 다른 시간에만 하는 날은 칸을 만들지 않아요
    if (it.slots.length && !it.slots.some(zoneOf)) continue;
    const init = {}, notes = {};
    it.slots = it.slots.filter(s => {
      const z = zoneOf(s);
      if (!z) return true;
      s.names.forEach(n => { init[n] = z.label; });
      if (s.note) notes[z.label] = s.note;
      return false;
    });
    it.board = { init, notes };
  }
}
function localKey(){ return 'tunteun:' + tState.date; }
function readLocal(){ try { return JSON.parse(store.get(localKey()) || '{}') || {}; } catch (e) { return {}; } }
function boardMap(board){
  return Object.assign({}, board.init, tState.sync ? (tState.server || {}) : readLocal(), tState.pending);
}
function boardSlots(board){
  const m = boardMap(board);
  return TUNTEUN_ZONES.map(z => ({ start: z.start, end: z.end, zone: z.label, note: board.notes[z.label] || '',
    names: Object.keys(m).filter(n => m[n] === z.label).sort(ko) }));
}
function boardPool(board){
  const m = boardMap(board);
  return [...new Set([...TUNTEUN_ROSTER, ...Object.keys(m)])].filter(n => !m[n]).sort(ko);
}
const allSlots = it => it.board ? it.slots.concat(boardSlots(it.board)) : it.slots;

function actsHtml(a){
  const block = (b, row) => (b.question ? `<p class="q">${esc(b.question)}</p>` : '') +
    (b.steps.length ? `<ul class="steps">` + b.steps.map(t => `<li>${esc(t)}</li>`).join('') + `</ul>` : '');
  const maxParts = Math.max(...a.acts.map(x => x.parts.length + (x.intro.question || x.intro.steps.length ? 1 : 0)));
  return (a.before ? `<p class="desc">${esc(a.before)}</p>` : '') +
    `<div class="acts" style="--cols:${Math.min(a.acts.length, 3)}">` + a.acts.map((act, ci) => {
      let row = 1;
      const cell = (cls, html) => `<div class="${cls}" style="--col:${ci + 1};--row:${row++}">${html}</div>`;
      return `<section class="act">` +
        cell('act-head', `<span class="act-no">활동 ${esc(act.no)}</span>${act.title ? `<h4>${esc(act.title)}</h4>` : ''}`) +
        (act.intro.question || act.intro.steps.length ? cell('part intro', block(act.intro)) : '') +
        act.parts.map(pt => cell('part',
          `<div class="part-head"><span class="part-no">${esc(pt.label)}</span>${pt.title ? `<b>${esc(pt.title)}</b>` : ''}` +
          (pt.cond ? `<span class="cond">${esc(pt.cond)}</span>` : '') + `</div>` +
          block(pt) +
          (pt.ref ? `<p class="ref"><span>레슨플랜 참고</span> ${esc(pt.ref)}</p>` : ''))).join('') +
        `</section>`;
    }).join('') + `</div>` +
    (a.after ? `<p class="desc after">${esc(a.after)}</p>` : '');
}

function statusBadge(st){
  return st === 'live' ? `<span class="badge">지금</span>` : st === 'done' ? `<span class="badge end">끝</span>` : '';
}
function boardHtml(board){
  const m = boardMap(board), sel = state.sel;
  const chip = n => `<button type="button" class="chip${n === state.me ? ' me' : ''}${n === sel ? ' sel' : ''}" data-name="${esc(n)}" aria-pressed="${n === sel}">${esc(n)}</button>`;
  const put = slot => sel && (m[sel] || '') !== slot ? `<button type="button" class="put" data-slot="${slot}">${slot ? '여기에 놓기' : '여기로 빼기'}</button>` : '';
  const pool = boardPool(board);
  return `<div class="board">
    <div class="zone pool" data-slot="">
      <div class="zone-head"><span class="zone-title">아직 시간을 안 고른 친구</span>
        <span class="hint">내 이름을 꾹 눌러서 아래 시간 칸으로 옮겨요</span>${put('')}</div>
      <div class="drop">${pool.map(chip).join('') || '<span class="empty">모두 시간을 골랐어요!</span>'}</div>
    </div>
    <div class="zones">` + boardSlots(board).map(z => {
      const st = slotStatus(z);
      return `<div class="zone time-zone ${st}" data-slot="${z.zone}">
        <div class="zone-head"><span class="time">${timeText(z)}</span>${statusBadge(st)}` +
          (z.note ? `<span class="note">${esc(z.note)}</span>` : '') +
          `<span class="count">${z.names.length}명</span>${put(z.zone)}</div>
        <div class="drop">${z.names.map(chip).join('') || '<span class="empty">여기로 옮겨 오세요</span>'}</div>
      </div>`;
    }).join('') + `</div></div>`;
}
let meTimer = null;
const DOW = ['일','월','화','수','목','금','토'];

function nowMin(){ const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function localDate(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function slotStatus(s){
  if (!state.data || state.data.date !== localDate()) return '';
  const n = nowMin(), a = pm(s.start), b = s.end == null ? null : pm(s.end);
  if (b == null || b <= a) return '';
  if (n >= b) return 'done';
  if (n >= a) return 'live';
  return '';
}
const timeText = s => fmt(s.start) + (s.end == null ? '' : ' ~ ' + fmt(s.end));

function renderHeader(){
  const iso = state.data && state.data.date || localDate();
  const [y, m, d] = iso.split('-').map(Number);
  const dow = DOW[new Date(y, m - 1, d).getDay()];
  $('date').innerHTML = `${m}월 ${d}일 ${dow}요일` + (state.data && state.data.week ? `<small>${esc(state.data.week.trim())}</small>` : '');
}

let drag = null, deferredRender = false, suppressClick = false;
function render(){
  if (drag) { deferredRender = true; return; }
  renderHeader();
  const main = $('main');

  if (!api) {
    main.innerHTML = `<div class="state"><img src="images/sitting-fox.png" alt=""><h2>시트와 아직 연결되지 않았어요</h2>

      <form class="setup" id="setup"><input id="apiInput" type="url" required placeholder="https://script.google.com/macros/s/…/exec" aria-label="웹 앱 주소"><button>연결하기</button></form></div>`;
    $('setup').onsubmit = e => { e.preventDefault(); store.set('schedule_api', $('apiInput').value.trim()); load(); };
    return;

  if (!state.data) {
    main.innerHTML = state.error
      ? `<div class="state"><img src="images/sitting-fox.png" alt=""><h2>시간표를 불러오지 못했어요</h2><p>선생님께 알려 주세요. 잠시 뒤 다시 시도할게요.</p>
          <details class="teacher"><summary>선생님용 정보</summary>
            <p><b>원인:</b> ${esc(state.error)}</p>
            <p><b>연결된 주소:</b> ${esc(api)}</p>
            <button type="button" id="resetApi">주소 다시 입력</button>
          </details></div>`
      : `<div class="state"><img src="images/sitting-fox.png" alt=""><h2>시간표를 가져오고 있어요…</h2></div>`;
    const reset = $('resetApi');
    if (reset) reset.onclick = () => { try { localStorage.removeItem('schedule_api'); } catch (e) {} state.error = ''; render(); };
    return;
  }
  if (!state.labs.length) {
    main.innerHTML = `<div class="state"><img src="images/sitting-fox.png" alt=""><h2>오늘은 적힌 활동이 없어요</h2><p>선생님께 물어보세요!</p></div>`;
    return;
  }

  const names = new Set();
  state.labs.forEach(l => l.items.forEach(it => allSlots(it).forEach(s => s.names.forEach(n => names.add(n)))));

  const sorted = [...names].sort((a, b) => a.localeCompare(b, 'ko'));

  if (sorted.length) {
    html += `<section class="names"><h2>내 이름을 눌러 보세요</h2><div class="name-list">` +
      sorted.map(n => `<button type="button" class="nm" data-name="${esc(n)}" aria-pressed="${n === state.me}">${esc(n)}</button>`).join('') +
      `</div></section>`;
  }

  if (state.me) {
    const mine = [];
    state.labs.forEach(l => l.items.forEach(it => allSlots(it).forEach(s => { if (s.names.includes(state.me)) mine.push({ l, it, s }); })));
    mine.sort((x, y) => pm(x.s.start) - pm(y.s.start));
    html += `<section class="mine"><div class="mine-head"><h2>${esc(state.me)}의 오늘</h2><button type="button" class="close" id="closeMine">닫기</button></div><ol>` +
      mine.map(({ l, it, s }) => `<li><span class="when">${timeText(s)}</span><span class="lab-tag" style="--c:${l.style[1]}">${l.style[0]} ${esc(l.name)}</span><span class="what">${esc(it.title)}</span></li>`).join('') +
      `</ol></section>`;
  }

  html += `<div class="grid">` + state.labs.map((l, li) => {
    const [ico, c, cl, cd] = l.style;
    const hit = state.me && l.items.some(it => allSlots(it).some(s => s.names.includes(state.me)));
    const wide = l.items.some(it => it.board || it.acts);
    return `<article class="card${hit ? ' hit' : ''}${wide ? ' wide' : ''}" style="--c:${c};--cl:${cl};--cd:${cd}">
      <div class="head"><span class="ico" aria-hidden="true">${ico}</span><h3>${esc(l.name)}</h3></div>
      <div class="body">` + l.items.map((it, ii) => {
        const key = l.name + '|' + ii, isOpen = state.open.has(key);

        return `<div class="item">` +
          (it.title ? `<div class="title">${esc(it.title)}</div>` : '') +
          (ii === 0 && l.theme ? `<div class="theme">${esc(l.theme)}</div>` : '') +
          (it.slots.length ? `<ul class="slots">` + it.slots.map(s => {
            const st = slotStatus(s), me = state.me && s.names.includes(state.me);
            return `<li class="slot ${st}${me ? ' mine-slot' : ''}"><div class="time">${timeText(s)}` +
              (st === 'live' ? `<span class="badge">지금</span>` : st === 'done' ? `<span class="badge end">끝</span>` : '') +
              (s.note ? `<span class="note">${esc(s.note)}</span>` : '') + `</div>` +
              (s.names.length ? `<div class="who">` + s.names.map(n => `<span${n === state.me ? ' class="me"' : ''}>${esc(n)}</span>`).join('') + `</div>` : '') +
              `</li>`;
          }).join('') + `</ul>` : '') +
          (it.board ? boardHtml(it.board) : '') +
          (it.acts ? actsHtml(it.acts) : it.desc ? `<p class="desc${long && !isOpen ? ' clamp' : ''}">${esc(it.desc)}</p>` +
            (long ? `<button type="button" class="more" data-key="${esc(key)}" aria-expanded="${isOpen}">${isOpen ? '접기 ▲' : '더 보기 ▼'}</button>` : '') : '') +
          `</div>`;
      }).join('') + `</div></article>`;
  }).join('') + `</div>`;

  main.innerHTML = html;
}

$('main').addEventListener('click', e => {
  const nm = e.target.closest('.nm');
  if (nm) {
    state.me = state.me === nm.dataset.name ? '' : nm.dataset.name;
    clearTimeout(meTimer);
    if (state.me) meTimer = setTimeout(() => { state.me = ''; render(); }, NAME_RESET_MS);
    render();
    const again = [...document.querySelectorAll('.nm')].find(b => b.dataset.name === nm.dataset.name);
    if (again) again.focus({ preventScroll: true });
    return;
  }
  if (e.target.closest('#closeMine')) { state.me = ''; clearTimeout(meTimer); render(); return; }
  const chip = e.target.closest('.chip');
  if (chip) {
    if (suppressClick) { suppressClick = false; return; }
    const name = chip.dataset.name;
    state.sel = state.sel === name ? '' : name;
    render();
    const again = [...document.querySelectorAll('.chip')].find(b => b.dataset.name === name);
    if (again) again.focus({ preventScroll: true });
    return;
  }
  const put = e.target.closest('.put');
  if (put && state.sel) { moveName(state.sel, put.dataset.slot); return; }
  const zone = e.target.closest('.board .zone');
  if (zone && state.sel) { moveName(state.sel, zone.dataset.slot); return; }
  const more = e.target.closest('.more');
  if (more) { const k = more.dataset.key; state.open.has(k) ? state.open.delete(k) : state.open.add(k); render(); }
});

/* ═══════════ 끌어서 옮기기 ═══════════ */
function zoneAt(x, y){ const el = document.elementFromPoint(x, y); return el && el.closest('.board .zone'); }
function setOver(z){
  if (!drag || drag.over === z) return;
  if (drag.over) drag.over.classList.remove('over');
  drag.over = z;
  if (z) z.classList.add('over');
}
function autoScroll(){
  if (!drag || !drag.moved) return;
  const edge = 80, y = drag.y;
  const v = y < edge ? -(edge - y) / 3 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 3 : 0;
  if (v) { scrollBy(0, v); setOver(zoneAt(drag.x, drag.y)); }
  requestAnimationFrame(autoScroll);
}
$('main').addEventListener('pointerdown', e => {
  suppressClick = false;
  const chip = e.target.closest('.chip');
  if (!chip || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const r = chip.getBoundingClientRect();
  drag = { chip, name: chip.dataset.name, from: chip.closest('.zone').dataset.slot, id: e.pointerId,
    x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top,
    w: r.width, h: r.height, moved: false, ghost: null, over: null };
  try { chip.setPointerCapture(e.pointerId); } catch (err) {}
});
$('main').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true;
    const g = drag.chip.cloneNode(true), cs = getComputedStyle(drag.chip);
    g.classList.add('ghost'); g.classList.remove('sel');
    g.removeAttribute('data-name'); g.setAttribute('aria-hidden', 'true');
    g.style.width = drag.w + 'px'; g.style.height = drag.h + 'px';
    ['--c', '--cl', '--cd'].forEach(k => g.style.setProperty(k, cs.getPropertyValue(k)));
    document.body.appendChild(g);
    drag.ghost = g;
    drag.chip.classList.add('lifting');
    document.body.classList.add('dragging');
    requestAnimationFrame(autoScroll);
  }
  e.preventDefault();
  drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px) rotate(-3deg) scale(1.08)`;
  setOver(zoneAt(e.clientX, e.clientY));
});
function endDrag(e, cancel){
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  if (d.over) d.over.classList.remove('over');
  drag = null;
  if (!d.moved) { if (deferredRender) { deferredRender = false; render(); } return; }
  suppressClick = true;
  d.ghost.remove();
  document.body.classList.remove('dragging');
  d.chip.classList.remove('lifting');
  deferredRender = false;
  const z = cancel ? null : zoneAt(e.clientX, e.clientY);
  if (z && z.dataset.slot !== d.from) moveName(d.name, z.dataset.slot);
  else render();
}
$('main').addEventListener('pointerup', e => endDrag(e, false));
$('main').addEventListener('pointercancel', e => endDrag(e, true));

function moveName(name, slot){
  state.sel = '';
  if (!state.data) return;
  const loc = readLocal(); loc[name] = slot; store.set(localKey(), JSON.stringify(loc));
  if (tState.sync) { tState.pending[name] = slot; sendMove(name, slot); }
  render(); renderFoot();
}
async function sendMove(name, slot){
  const date = tState.date;
  try {
    const r = await apiGet({ action: 'tunteun', date, name, slot });
    if (r.status !== 'ok') throw new Error(r.message || 'error');
    if (tState.date !== date) return;
    if (r.tunteun) tState.server = r.tunteun;
    if (tState.pending[name] === slot) delete tState.pending[name];
    tState.failed = false;
  } catch (err) {
    tState.failed = true;   // 다음에 시트를 다시 읽을 때 또 보내요
  }
  render(); renderFoot();
}

function renderFoot(){
  const d = state.data;
  let t = '';
  if (d && d.updated) t = `시트에서 ${esc(d.updated.slice(11, 16))}에 가져왔어요 · 1분마다 새로 확인해요`;
  if (state.stale) t += ` <span class="warn">· 지금은 연결이 안 돼서 마지막 내용을 보여 주고 있어요</span>`;
  const hasBoard = state.labs.some(l => l.items.some(it => it.board));
  if (hasBoard && !tState.sync) t += ` · 튼튼 시간은 이 기기에만 저장돼요`;
  if (hasBoard && tState.sync && Object.keys(tState.pending).length && tState.failed) t += ` <span class="warn">· 튼튼 시간을 아직 시트에 못 보냈어요</span>`;
  $('foot').innerHTML = t;
}

function tick(){
  const d = new Date();
  $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ═══════════ 시트에서 가져오기 ═══════════ */
function accept(data){
  state.data = data;
  state.labs = data.found === false ? [] : buildLabs(data.rows || []);
  attachBoards(state.labs);
  if (tState.date !== data.date) { tState.date = data.date; tState.pending = {}; tState.failed = false; state.sel = ''; }
  tState.sync = 'tunteun' in data;      // 시트에 저장하는 새 버전의 schedule.gs 인지
  tState.server = data.tunteun || null;
}

async function apiGet(query){
  const api = store.get('schedule_api') || DEFAULT_API_URL;
  const qs = new URLSearchParams(query);
  qs.set('t', Date.now());
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = await fetch(api + (api.includes('?') ? '&' : '?') + qs, { signal: ctrl.signal, cache: 'no-store' });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch (e) {
      throw new Error(/accounts\.google\.com|로그인|Sign in/i.test(text)
        ? '웹 앱이 로그인을 요구해요. 배포 설정의 액세스 권한을 "모든 사용자"로 바꿔 주세요.'
        : '웹 앱 주소가 시간표 데이터를 돌려주지 않아요. …/exec 로 끝나는 웹 앱 주소인지, schedule.gs 가 배포됐는지 확인해 주세요.');
    }
  } finally {
    clearTimeout(timer);
  }
}
let loading = false;
async function load(){
  const api = store.get('schedule_api') || DEFAULT_API_URL;
  if (!api) { render(); return; }
  if (loading) return;
  loading = true;
  if (!state.data) render();
  try {
    const data = await apiGet(dateOverride ? { date: dateOverride } : {});
    if (data.status !== 'ok') throw new Error(data.message || '시트를 읽는 중 오류가 났어요.');
    if (!('rows' in data)) throw new Error('다른 Apps Script 의 주소 같아요. schedule.gs 를 배포한 주소인지 확인해 주세요.');
    accept(data);
    state.stale = false; state.error = '';
    if (tState.sync) for (const [n, sl] of Object.entries(tState.pending)) sendMove(n, sl);
    store.set('schedule_last', JSON.stringify(data));
  } catch (err) {
    state.error = String(err && err.message || err);
    if (/Failed to fetch|NetworkError|Load failed/i.test(state.error)) {
      state.error = '주소에 연결할 수 없어요. 웹 앱 주소(…/exec)가 맞는지, 액세스 권한이 "모든 사용자"인지, 인터넷이 되는지 확인해 주세요.';
    } else if (err && err.name === 'AbortError') {
      state.error = '응답이 너무 오래 걸려요. 잠시 뒤 다시 시도할게요.';
    }
    if (!state.data) {
      // 연결이 안 되면, 같은 날 마지막으로 받은 내용을 보여 줍니다
      try {
        const last = JSON.parse(store.get('schedule_last') || 'null');
        if (last && last.date === (dateOverride || localDate())) accept(last);
      } catch (e) {}
    }
    state.stale = !!state.data;
  } finally {
    loading = false;
  }
  render(); renderFoot();
}

tick(); render(); load();
setInterval(load, REFRESH_MS);
setInterval(() => { tick(); }, 10 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
